
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambium-SMP | Hardcore Dashboard</title>
  <style>
    :root {
      --bg: #171714;
      --panel: #211e18;
      --gold: #d4b477;
      --text: #f1eadb;
      --muted: #a49a87;
      --green: #83b879;
      --red: #c76c62;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse at top, #393023 0%, var(--bg) 60%);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 42px 16px 30px;
      border-bottom: 1px solid #51432d;
    }

    .emblem {
      color: var(--gold);
      font-size: 38px;
    }

    h1 {
      color: var(--gold);
      letter-spacing: 5px;
      font-size: clamp(25px, 5vw, 42px);
      margin: 12px 0;
    }

    header p {
      color: var(--muted);
      letter-spacing: 3px;
      font: 12px Arial, sans-serif;
    }

    main {
      max-width: 1050px;
      margin: auto;
      padding: 26px 18px 50px;
    }

    .notice {
      background: #28251e;
      border: 1px solid #51432d;
      color: var(--muted);
      padding: 13px 16px;
      border-radius: 8px;
      font: 13px/1.6 Arial, sans-serif;
      margin-bottom: 22px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 32px;
    }

    .stat, .panel {
      background: linear-gradient(145deg, #29251e, var(--panel));
      border: 1px solid #51432d;
      border-radius: 10px;
      padding: 22px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font: 12px Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .stat strong {
      display: block;
      font-size: 34px;
      margin-top: 12px;
    }

    .alive-number { color: var(--green); }
    .dead-number { color: var(--red); }
    .online-number { color: var(--gold); }

    h2 {
      font-size: 22px;
      color: var(--gold);
      font-weight: normal;
      margin-top: 0;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    input, select {
      background: #171714;
      border: 1px solid #51432d;
      color: var(--text);
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    input { flex: 1; min-width: 150px; }

    .player {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 0;
      border-bottom: 1px solid #40382b;
      font-family: Arial, sans-serif;
    }

    .player:last-child { border-bottom: 0; }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      background: #403526;
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .player-info { flex: 1; }
    .player-name { font-weight: bold; }
    .role {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .pill {
      font: 11px Arial, sans-serif;
      border-radius: 20px;
      padding: 7px 10px;
      white-space: nowrap;
    }

    .status-alive { background: #263b29; color: #a9d59f; }
    .status-dead { background: #482724; color: #efaaa0; }
    .status-online { background: #443a24; color: #e5c986; }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .count { color: var(--muted); font: 12px Arial, sans-serif; }

    .empty {
      padding: 18px 0;
      color: var(--muted);
      font-family: Arial, sans-serif;
    }

    footer {
      text-align: center;
      color: #817765;
      font: 12px Arial, sans-serif;
      padding: 25px;
      border-top: 1px solid #40382b;
    }

    @media (max-width: 540px) {
      .stats { gap: 8px; }
      .stat { padding: 14px 10px; }
      .stat strong { font-size: 27px; }
      .stat span { letter-spacing: 1px; font-size: 10px; }
      .panel { padding: 16px; }
      .pill { font-size: 10px; padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="emblem">⚔</div>
    <h1>CAMBIUM-SMP</h1>
    <p>STATUS · HARDCORE</p>
  </header>

  <main>
    <div class="notice">
      ⚠ Dit dashboard gebruikt momenteel voorbeeldspelers.
      De gegevens zijn nog niet gekoppeld aan de echte Minecraft-server.
    </div>

    <div class="stats">
      <div class="stat">
        <span>Levend</span>
        <strong class="alive-number" id="aliveCount">0</strong>
      </div>
      <div class="stat">
        <span>Dood</span>
        <strong class="dead-number" id="deadCount">0</strong>
      </div>
      <div class="stat">
        <span>Online</span>
        <strong class="online-number" id="onlineCount">0</strong>
      </div>
    </div>

    <section class="panel">
      <div class="section-title">
        <h2>⚔ Overlevenden</h2>
        <span class="count" id="survivorCount"></span>
      </div>

      <div class="toolbar">
        <input id="search" type="search" placeholder="Zoek een speler...">
        <select id="filter">
          <option value="all">Alle spelers</option>
          <option value="online">Alleen online</option>
          <option value="offline">Alleen offline</option>
        </select>
      </div>

      <div id="survivors"></div>
    </section>

    <div style="height:22px"></div>

    <section class="panel">
      <div class="section-title">
        <h2>☠ Verliezerseiland</h2>
        <span class="count" id="deadPlayerCount"></span>
      </div>
      <div id="deadPlayers"></div>
    </section>
  </main>

  <footer>CAMBIUM-SMP · HARDCORE COMMUNITY</footer>

  <script>
    // VOORBEELDDATA — later vervangen door echte servergegevens.
    const players = [
      { name: "VoorbeeldSpeler", role: "Speler", alive: true, online: true },
      { name: "VoorbeeldMod", role: "Moderator", alive: true, online: false },
      { name: "VoorbeeldDood", role: "Speler", alive: false, online: false }
    ];

    const survivors = document.getElementById("survivors");
    const deadPlayers = document.getElementById("deadPlayers");
    const search = document.getElementById("search");
    const filter = document.getElementById("filter");

    function makePlayer(player) {
      const div = document.createElement("div");
      div.className = "player";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = player.alive ? "🛡️" : "☠️";

      const info = document.createElement("div");
      info.className = "player-info";

      const name = document.createElement("div");
      name.className = "player-name";
      name.textContent = player.name;

      const role = document.createElement("div");
      role.className = "role";
      role.textContent = player.role;

      info.append(name, role);

      const status = document.createElement("span");
      status.className = "pill " +
        (player.alive ? "status-alive" : "status-dead");
      status.textContent = player.alive ? "● LEVEND" : "☠ UITGESCHAKELD";

      div.append(avatar, info, status);

      if (player.alive) {
        const online = document.createElement("span");
        online.className = "pill " +
          (player.online ? "status-online" : "");
        online.textContent = player.online ? "ONLINE" : "OFFLINE";
        div.append(online);
      }

      return div;
    }

    function render() {
      const alive = players.filter(p => p.alive);
      const dead = players.filter(p => !p.alive);

      document.getElementById("aliveCount").textContent = alive.length;
      document.getElementById("deadCount").textContent = dead.length;
      document.getElementById("onlineCount").textContent =
        players.filter(p => p.online && p.alive).length;

      const query = search.value.trim().toLowerCase();
      const mode = filter.value;

      const shown = alive.filter(p =>
        p.name.toLowerCase().includes(query) &&
        (mode === "all" || (mode === "online" ? p.online : !p.online))
      );

      survivors.replaceChildren();
      shown.forEach(p => survivors.appendChild(makePlayer(p)));

      if (shown.length === 0) {
        survivors.innerHTML = '<div class="empty">Geen spelers gevonden.</div>';
      }

      deadPlayers.replaceChildren();
      dead.forEach(p => deadPlayers.appendChild(makePlayer(p)));

      if (dead.length === 0) {
        deadPlayers.innerHTML = '<div class="empty">Nog niemand op Verliezerseiland.</div>';
      }

      document.getElementById("survivorCount").textContent =
        alive.length + " overlevenden";
      document.getElementById("deadPlayerCount").textContent =
        dead.length + " uitgeschakeld";
    }

    search.addEventListener("input", render);
    filter.addEventListener("change", render);
    render();
  </script>
</body>
</html>
